<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TechPack 翻译审核</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f4f6f8; color: #17202a; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    header { display: flex; align-items: center; gap: 18px; padding: 14px 20px; background: #17202a; color: #fff; }
    header h1 { margin: 0; font-size: 20px; }
    #stats { margin-left: auto; font-variant-numeric: tabular-nums; }
    .filters { display: grid; grid-template-columns: repeat(5, minmax(130px, 1fr)); gap: 10px; padding: 12px 20px; background: #fff; border-bottom: 1px solid #d8dee4; }
    label { display: grid; gap: 4px; color: #566573; font-size: 12px; }
    select, textarea, button { font: inherit; }
    select, textarea { border: 1px solid #b8c2cc; border-radius: 5px; padding: 7px; background: #fff; }
    main { display: grid; grid-template-columns: minmax(240px, 28%) minmax(380px, 44%) minmax(260px, 28%); min-height: calc(100vh - 122px); }
    #item-list { overflow: auto; border-right: 1px solid #d8dee4; background: #fff; padding: 10px; }
    .page-group { margin: 0 0 10px; border: 1px solid #d8dee4; border-radius: 8px; background: #fff; overflow: hidden; }
    .page-group[open] { border-color: #b8c2cc; box-shadow: 0 2px 8px #10182812; }
    .page-group-summary { position: relative; padding: 11px 34px 11px 12px; background: #f8fafc; cursor: pointer; list-style: none; }
    .page-group-summary::-webkit-details-marker { display: none; }
    .page-group-summary::after { content: "展开"; position: absolute; top: 13px; right: 11px; color: #667085; font-size: 11px; }
    .page-group[open] > .page-group-summary::after { content: "收起"; }
    .page-summary-line { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .page-title { font-size: 15px; }
    .page-meta { margin-top: 4px; color: #667085; font-size: 12px; }
    .page-risk-badge, .item-badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 2px 7px; font-size: 11px; font-weight: 700; white-space: nowrap; }
    .risk-high { background: #fee4e2; color: #b42318; }
    .risk-medium { background: #fef0c7; color: #b54708; }
    .risk-low { background: #dcfae6; color: #067647; }
    .page-items { padding: 8px; border-top: 1px solid #eaecf0; }
    .review-item { display: block; width: 100%; margin: 0 0 7px; padding: 10px; text-align: left; border: 1px solid #d8dee4; border-radius: 6px; background: #fff; color: inherit; cursor: pointer; }
    .review-item:last-child { margin-bottom: 0; }
    .review-item.active { border-color: #2463a6; box-shadow: 0 0 0 2px #c8ddf3; }
    .review-item[data-risk="high"] { border-left: 5px solid #b42318; }
    .review-item-heading { display: flex; align-items: center; gap: 5px; }
    .review-item-status { margin-left: auto; background: #f2f4f7; color: #475467; }
    .review-item-source { display: block; margin-top: 6px; color: #344054; line-height: 1.35; overflow-wrap: anywhere; }
    .empty-list { padding: 24px 10px; color: #667085; text-align: center; }
    .viewer { padding: 16px; overflow: auto; }
    .canvas { position: relative; display: inline-block; max-width: 100%; background: #fff; box-shadow: 0 2px 12px #0002; }
    #page-thumbnail { display: block; max-width: 100%; height: auto; }
    .highlight { position: absolute; display: none; pointer-events: none; border: 3px solid #d92d20; background: #d92d2030; }
    #target-highlight { border-color: #1570ef; background: #1570ef24; }
    aside { padding: 14px; overflow: auto; background: #fff; border-left: 1px solid #d8dee4; }
    aside h2 { margin: 0 0 12px; font-size: 17px; }
    dl { margin: 0; }
    dt { margin-top: 10px; color: #667085; font-size: 12px; font-weight: 700; }
    dd { margin: 3px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    #reviewed-translation { width: 100%; min-height: 92px; resize: vertical; }
    .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-top: 14px; }
    button { border: 1px solid #98a2b3; border-radius: 5px; padding: 8px; background: #fff; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .45; }
    #approve { background: #ecfdf3; border-color: #12b76a; }
    #approve-edited { background: #eff8ff; border-color: #2e90fa; }
    #skip { background: #fff4ed; border-color: #f79009; }
    #export-review { margin-top: 12px; width: 100%; background: #17202a; color: #fff; }
    #model-risk { color: #b42318; font-weight: 700; }
    .plain-lines { display: grid; gap: 5px; }
    .plain-lines p { margin: 0; }
    .risk-box { padding: 9px 10px; border: 1px solid #d0d5dd; border-radius: 6px; background: #f9fafb; }
    .risk-box[data-risk="low"] { border-color: #6ce9a6; background: #ecfdf3; }
    .risk-box[data-risk="medium"] { border-color: #fec84b; background: #fffaeb; }
    .risk-box[data-risk="high"] { border-color: #fda29b; background: #fef3f2; }
    .risk-label { display: block; margin-bottom: 3px; font-weight: 700; }
    .risk-warnings { margin: 7px 0 0; padding-left: 20px; }
    @media (max-width: 980px) {
      .filters { grid-template-columns: repeat(2, 1fr); }
      main { grid-template-columns: 1fr; }
      #item-list, aside { border: 0; }
    }
  </style>
</head>
<body>
  <header>
    <h1>TechPack 翻译审核</h1>
    <div id="stats" aria-live="polite"></div>
  </header>
  <section class="filters" aria-label="审核筛选">
    <label>页面类型<select id="page-type-filter"><option value="">全部</option></select></label>
    <label>风险<select id="risk-filter"><option value="">全部</option><option value="high">高</option><option value="medium">中</option><option value="low">低</option></select></label>
    <label>术语<select id="glossary-filter"><option value="">全部</option><option value="hit">有命中</option><option value="none">无命中</option></select></label>
    <label>审核状态<select id="status-filter"><option value="">全部</option><option value="unreviewed">未审核</option><option value="approved">已批准</option><option value="approved_edited">修改后批准</option><option value="skipped">已跳过</option></select></label>
    <label>问题<select id="issue-filter"><option value="">全部</option><option value="any">有问题</option><option value="none">无问题</option></select></label>
  </section>
  <main>
    <nav id="item-list" aria-label="审核项目"></nav>
    <section class="viewer" aria-label="页面预览">
      <div class="canvas">
        <img id="page-thumbnail" alt="当前页面缩略图">
        <div id="source-highlight" class="highlight" aria-label="原文坐标"></div>
        <div id="target-highlight" class="highlight" aria-label="建议批注坐标"></div>
      </div>
    </section>
    <aside>
      <h2 id="item-title">请选择审核项目</h2>
      <dl>
        <dt>原文</dt><dd id="source-text"></dd>
        <dt>建议译文</dt><dd id="suggested-translation"></dd>
        <dt>审核译文</dt><dd><textarea id="reviewed-translation" aria-label="审核译文"></textarea></dd>
        <dt>锁定 token</dt><dd id="locked-tokens"></dd>
        <dt>术语命中</dt><dd id="glossary-hits"></dd>
        <dt>为什么需要翻译</dt><dd id="decision-reason"></dd>
        <dt>原文与译文位置</dt><dd id="coordinates" class="plain-lines"></dd>
        <dt>排版提示</dt><dd id="layout-risk"></dd>
        <dt>翻译来源</dt><dd id="translator-provenance"></dd>
        <dt>模型风险</dt><dd id="model-risk"></dd>
      </dl>
      <div class="actions" aria-label="审核操作">
        <button id="approve" type="button">批准</button>
        <button id="approve-edited" type="button">修改后批准</button>
        <button id="skip" type="button">跳过</button>
      </div>
      <button id="export-review" type="button" disabled>导出 review.json</button>
    </aside>
  </main>

  <script id="review-data" type="application/json">__TECHPACK_REVIEW_DATA__</script>
  <script>
    "use strict";
    const data = JSON.parse(document.getElementById("review-data").textContent);
    const allowedStatuses = new Set(["approved", "approved_edited", "skipped"]);
    const itemFields = [
      "item_id", "page_index", "page_type", "source_text", "normalized_text",
      "source_bbox", "source_kind", "coordinate_confidence", "decision_reason",
      "locked_tokens", "glossary_hits", "suggested_translation", "reviewed_translation",
      "review_status", "risk_level", "translation_host", "translation_execution_mode",
      "translation_model", "translation_agent_role", "translation_prompt_version",
      "placement_strategy", "target_rect", "font_size", "leader_line", "warnings"
    ];
    const elements = Object.fromEntries([
      "page-type-filter", "risk-filter", "glossary-filter", "status-filter", "issue-filter",
      "item-list", "page-thumbnail", "source-highlight", "target-highlight", "source-text",
      "suggested-translation", "reviewed-translation", "locked-tokens", "glossary-hits",
      "decision-reason", "coordinates", "layout-risk", "translator-provenance",
      "model-risk", "stats", "item-title", "approve", "approve-edited", "skip",
      "export-review"
    ].map((id) => [id, document.getElementById(id)]));
    let selectedId = null;
    const originalOrder = new Map(data.items.map((item, index) => [item.item_id, index]));
    const riskOrder = {high: 0, medium: 1, low: 2};
    const riskLabels = {high: "高风险", medium: "需留意", low: "低风险"};
    const statusLabels = {
      unreviewed: "待审核",
      approved: "已批准",
      approved_edited: "修改后批准",
      skipped: "已跳过"
    };
    const pageTypeLabels = data.review_navigation.page_type_labels || {};
    const openPages = new Set();
    if (data.review_navigation.default_open_page_index !== null) {
      openPages.add(data.review_navigation.default_open_page_index);
    }

    function text(id, value) {
      elements[id].textContent = value === null || value === undefined ? "—" : String(value);
    }

    function renderLines(id, lines) {
      elements[id].replaceChildren();
      (Array.isArray(lines) ? lines : []).forEach((value) => {
        const paragraph = document.createElement("p");
        paragraph.textContent = value;
        elements[id].appendChild(paragraph);
      });
    }

    function renderLayoutRisk(risk) {
      const box = document.createElement("div");
      box.className = "risk-box";
      box.dataset.risk = risk && risk.level ? risk.level : "unknown";
      const label = document.createElement("span");
      label.className = "risk-label";
      label.textContent = risk && risk.label ? risk.label : "请人工检查";
      const summary = document.createElement("span");
      summary.textContent = risk && risk.summary ? risk.summary : "请人工确认排版是否合适。";
      box.append(label, summary);
      if (risk && Array.isArray(risk.warnings) && risk.warnings.length) {
        const list = document.createElement("ul");
        list.className = "risk-warnings";
        risk.warnings.forEach((warning) => {
          const item = document.createElement("li");
          item.textContent = warning;
          list.appendChild(item);
        });
        box.appendChild(list);
      }
      elements["layout-risk"].replaceChildren(box);
    }

    function addOption(select, value, label = value) {
      const option = document.createElement("option");
      option.value = value;
      option.textContent = label;
      select.appendChild(option);
    }

    [...new Set(data.items.map((item) => item.page_type))].sort().forEach((value) => {
      addOption(elements["page-type-filter"], value, pageTypeLabels[value] || value);
    });

    function itemIssues(item) {
      const issues = Array.isArray(item.warnings) ? [...item.warnings] : [];
      if (item.coordinate_confidence !== "high") issues.push("coordinate_confidence");
      if (item.translation_model === "unknown") issues.push("unknown_model");
      return issues;
    }

    [...new Set(data.items.flatMap(itemIssues))].sort().forEach((value) => {
      addOption(elements["issue-filter"], value);
    });

    function visible(item) {
      const status = item.review_status || "unreviewed";
      const glossary = Array.isArray(item.glossary_hits) && item.glossary_hits.length ? "hit" : "none";
      const issues = itemIssues(item);
      const issue = issues.length ? "any" : "none";
      const issueFilter = elements["issue-filter"].value;
      return (!elements["page-type-filter"].value || item.page_type === elements["page-type-filter"].value)
        && (!elements["risk-filter"].value || item.risk_level === elements["risk-filter"].value)
        && (!elements["glossary-filter"].value || glossary === elements["glossary-filter"].value)
        && (!elements["status-filter"].value || status === elements["status-filter"].value)
        && (!issueFilter || issue === issueFilter || issues.includes(issueFilter));
    }

    function itemRiskRank(item) {
      return Object.hasOwn(riskOrder, item.risk_level) ? riskOrder[item.risk_level] : 3;
    }

    function prioritizedGroups() {
      const grouped = new Map();
      data.items.filter(visible).forEach((item) => {
        if (!grouped.has(item.page_index)) grouped.set(item.page_index, []);
        grouped.get(item.page_index).push(item);
      });
      const groups = [...grouped.entries()].map(([pageIndex, items]) => {
        items.sort((left, right) => {
          const reviewDifference = Number(Boolean(left.review_status)) - Number(Boolean(right.review_status));
          if (reviewDifference) return reviewDifference;
          const riskDifference = itemRiskRank(left) - itemRiskRank(right);
          if (riskDifference) return riskDifference;
          return originalOrder.get(left.item_id) - originalOrder.get(right.item_id);
        });
        const riskCounts = {high: 0, medium: 0, low: 0};
        items.forEach((item) => {
          if (Object.hasOwn(riskCounts, item.risk_level)) riskCounts[item.risk_level] += 1;
        });
        const highestRisk = [...items].sort((left, right) => itemRiskRank(left) - itemRiskRank(right))[0].risk_level;
        return {
          pageIndex,
          items,
          riskCounts,
          highestRisk,
          unreviewedCount: items.filter((item) => !item.review_status).length,
          hasUnreviewedHighestRisk: items.some((item) => !item.review_status && item.risk_level === highestRisk)
        };
      });
      groups.sort((left, right) => {
        const riskDifference = (riskOrder[left.highestRisk] ?? 3) - (riskOrder[right.highestRisk] ?? 3);
        if (riskDifference) return riskDifference;
        const reviewDifference = Number(!left.hasUnreviewedHighestRisk) - Number(!right.hasUnreviewedHighestRisk);
        if (reviewDifference) return reviewDifference;
        return left.pageIndex - right.pageIndex;
      });
      return groups;
    }

    function riskBadge(risk, count, className) {
      const badge = document.createElement("span");
      badge.className = `${className} risk-${risk}`;
      badge.textContent = `${riskLabels[risk] || "请检查"}${count === null ? "" : ` ${count}`}`;
      return badge;
    }

    function renderList() {
      elements["item-list"].replaceChildren();
      const groups = prioritizedGroups();
      if (!groups.length) {
        const empty = document.createElement("p");
        empty.className = "empty-list";
        empty.textContent = "当前筛选条件下没有审核项目";
        elements["item-list"].appendChild(empty);
        return;
      }
      if (!groups.some((group) => openPages.has(group.pageIndex))) {
        openPages.add(groups[0].pageIndex);
      }
      groups.forEach((group) => {
        const details = document.createElement("details");
        details.className = "page-group";
        if (openPages.has(group.pageIndex) || group.items.some((item) => item.item_id === selectedId)) {
          details.open = true;
        }
        const summary = document.createElement("summary");
        summary.className = "page-group-summary";
        const summaryLine = document.createElement("div");
        summaryLine.className = "page-summary-line";
        const title = document.createElement("strong");
        title.className = "page-title";
        title.textContent = `第 ${group.pageIndex + 1} 页`;
        summaryLine.append(title, riskBadge(group.highestRisk, group.riskCounts[group.highestRisk], "page-risk-badge"));
        const meta = document.createElement("div");
        meta.className = "page-meta";
        const pageType = group.items[0].page_type;
        const progress = group.unreviewedCount ? `待审核 ${group.unreviewedCount} 项` : "本页已审核";
        meta.textContent = `${progress} · ${pageTypeLabels[pageType] || pageType}`;
        summary.append(summaryLine, meta);
        const itemList = document.createElement("div");
        itemList.className = "page-items";
        group.items.forEach((item) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "review-item" + (item.item_id === selectedId ? " active" : "");
          button.dataset.risk = item.risk_level;
          button.title = item.item_id;
          const heading = document.createElement("span");
          heading.className = "review-item-heading";
          heading.appendChild(riskBadge(item.risk_level, null, "item-badge"));
          const status = document.createElement("span");
          status.className = "item-badge review-item-status";
          status.textContent = statusLabels[item.review_status || "unreviewed"] || "待审核";
          heading.appendChild(status);
          const source = document.createElement("span");
          source.className = "review-item-source";
          source.textContent = item.source_text || "（无原文）";
          button.append(heading, source);
          button.addEventListener("click", () => selectItem(item.item_id));
          itemList.appendChild(button);
        });
        details.append(summary, itemList);
        details.addEventListener("toggle", () => {
          if (details.open) openPages.add(group.pageIndex);
          else openPages.delete(group.pageIndex);
        });
        elements["item-list"].appendChild(details);
      });
    }

    function placeHighlight(id, rectangle, page) {
      const box = elements[id];
      if (!Array.isArray(rectangle) || rectangle.length !== 4 || !page.width || !page.height) {
        box.style.display = "none";
        return;
      }
      box.style.left = `${rectangle[0] / page.width * 100}%`;
      box.style.top = `${rectangle[1] / page.height * 100}%`;
      box.style.width = `${(rectangle[2] - rectangle[0]) / page.width * 100}%`;
      box.style.height = `${(rectangle[3] - rectangle[1]) / page.height * 100}%`;
      box.style.display = "block";
    }

    function selectItem(itemId) {
      selectedId = itemId;
      const item = data.items.find((candidate) => candidate.item_id === itemId);
      if (!item) return;
      openPages.add(item.page_index);
      const page = data.pages.find((candidate) => candidate.page_index === item.page_index);
      if (page) {
        elements["page-thumbnail"].src = page.thumbnail;
        elements["page-thumbnail"].onload = () => {
          placeHighlight("source-highlight", item.source_bbox, page);
          placeHighlight("target-highlight", item.target_rect, page);
        };
      }
      text("item-title", `${item.item_id} · 第 ${item.page_index + 1} 页`);
      text("source-text", item.source_text);
      text("suggested-translation", item.suggested_translation);
      elements["reviewed-translation"].value = item.reviewed_translation || item.suggested_translation || "";
      text("locked-tokens", JSON.stringify(item.locked_tokens || []));
      text("glossary-hits", JSON.stringify(item.glossary_hits || []));
      const explanation = data.business_explanations[item.item_id] || {};
      text("decision-reason", explanation.decision_reason || "系统已选中这段文字，请人工确认。");
      renderLines("coordinates", explanation.coordinates || ["请人工检查原文和译文位置。"]);
      renderLayoutRisk(explanation.layout_risk);
      text("translator-provenance", [
        item.translation_host, item.translation_execution_mode, item.translation_model,
        item.translation_agent_role, item.translation_prompt_version
      ].join(" · "));
      const risks = [];
      if (item.translation_model === "unknown") risks.push("模型未知");
      const switchFields = [
        ["translation_host", "宿主切换"],
        ["translation_model", "模型切换"],
        ["translation_execution_mode", "执行方式切换"],
        ["translation_prompt_version", "提示词版本切换"]
      ];
      switchFields.forEach(([field, label]) => {
        if (new Set(data.items.map((candidate) => candidate[field])).size > 1) risks.push(label);
      });
      text("model-risk", risks.join("；") || "无");
      renderList();
    }

    function setStatus(status) {
      const item = data.items.find((candidate) => candidate.item_id === selectedId);
      if (!item || !allowedStatuses.has(status)) return;
      if (status === "approved_edited") {
        const edited = elements["reviewed-translation"].value.trim();
        if (!edited) return;
        item.reviewed_translation = edited;
      } else if (status === "approved") {
        item.reviewed_translation = null;
      } else {
        item.reviewed_translation = null;
      }
      item.review_status = status;
      renderAll();
    }

    function renderStats() {
      const counts = {unreviewed: 0, approved: 0, approved_edited: 0, skipped: 0};
      data.items.forEach((item) => { counts[item.review_status || "unreviewed"] += 1; });
      text("stats", `未审核 ${counts.unreviewed} · 已批准 ${counts.approved} · 已修改 ${counts.approved_edited} · 已跳过 ${counts.skipped} · 阻断 ${data.blocking_issues.length}`);
      elements["export-review"].disabled = counts.unreviewed !== 0 || data.blocking_issues.length !== 0;
    }

    function exportReview() {
      if (data.blocking_issues.length || data.items.some((item) => !allowedStatuses.has(item.review_status))) return;
      if (data.items.some((item) => item.review_status === "approved_edited" && !(item.reviewed_translation || "").trim())) return;
      if (data.items.some((item) => item.review_status === "approved" && !(item.suggested_translation || "").trim())) return;
      const payload = {
        schema_version: "1.1",
        job_id: data.job_id,
        source: {filename: data.source.filename, sha256: data.source.sha256, page_count: data.source.page_count},
        glossary: {filename: data.glossary.filename, sha256: data.glossary.sha256},
        pipeline: {
          parser: data.pipeline.parser,
          translation_executor: data.pipeline.translation_executor,
          host: data.pipeline.host,
          execution_mode: data.pipeline.execution_mode,
          model: data.pipeline.model,
          prompt_version: data.pipeline.prompt_version
        },
        items: data.items.map((item) => Object.fromEntries(itemFields.map((field) => [field, item[field]]))),
        blocking_issues: [],
        review_completed_at: new Date().toISOString()
      };
      const blob = new Blob([JSON.stringify(payload, null, 2) + "\n"], {type: "application/json"});
      const link = document.createElement("a");
      link.href = window.URL.createObjectURL(blob);
      link.download = "review.json";
      link.click();
      window.URL.revokeObjectURL(link.href);
    }

    function renderAll() {
      renderList();
      renderStats();
    }

    ["page-type-filter", "risk-filter", "glossary-filter", "status-filter", "issue-filter"].forEach((id) => {
      elements[id].addEventListener("change", renderList);
    });
    elements.approve.addEventListener("click", () => setStatus("approved"));
    elements["approve-edited"].addEventListener("click", () => setStatus("approved_edited"));
    elements.skip.addEventListener("click", () => setStatus("skipped"));
    elements["export-review"].addEventListener("click", exportReview);
    renderAll();
    const initialGroups = prioritizedGroups();
    if (initialGroups.length) selectItem(initialGroups[0].items[0].item_id);
  </script>
</body>
</html>
