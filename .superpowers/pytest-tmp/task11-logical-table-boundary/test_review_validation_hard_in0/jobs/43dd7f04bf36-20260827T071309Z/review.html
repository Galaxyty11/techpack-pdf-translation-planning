  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f4f6f8; color: #17202a; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    header { display: flex; align-items: center; gap: 18px; padding: 14px 20px; background: #17202a; color: #fff; }
    header h1 { margin: 0; font-size: 20px; }
    #stats { margin-left: auto; font-variant-numeric: tabular-nums; }
    .filters { display: grid; grid-template-columns: repeat(5, minmax(130px, 1fr)); gap: 10px; padding: 12px 20px; background: #fff; border-bottom: 1px solid #d8dee4; }
    label { display: grid; gap: 4px; color: #566573; font-size: 12px; }
    select, textarea, button { font: inherit; }
    select, textarea { border: 1px solid #b8c2cc; border-radius: 5px; padding: 7px; background: #fff; }
    main { display: grid; grid-template-columns: minmax(240px, 28%) minmax(380px, 44%) minmax(260px, 28%); min-height: calc(100vh - 122px); }
    #item-list { overflow: auto; border-right: 1px solid #d8dee4; background: #fff; padding: 10px; }
    .review-item { display: block; width: 100%; margin: 0 0 7px; padding: 10px; text-align: left; border: 1px solid #d8dee4; border-radius: 6px; background: #fff; color: inherit; cursor: pointer; }
    .review-item.active { border-color: #2463a6; box-shadow: 0 0 0 2px #c8ddf3; }
    .review-item[data-risk="high"] { border-left: 5px solid #b42318; }
    .viewer { padding: 16px; overflow: auto; }
    .canvas { position: relative; display: inline-block; max-width: 100%; background: #fff; box-shadow: 0 2px 12px #0002; }
    #page-thumbnail { display: block; max-width: 100%; height: auto; }
    .highlight { position: absolute; display: none; pointer-events: none; border: 3px solid #d92d20; background: #d92d2030; }
    #target-highlight { border-color: #1570ef; background: #1570ef24; }
    aside { padding: 14px; overflow: auto; background: #fff; border-left: 1px solid #d8dee4; }
    aside h2 { margin: 0 0 12px; font-size: 17px; }
    dl { margin: 0; }
    dt { margin-top: 10px; color: #667085; font-size: 12px; font-weight: 700; }
    dd { margin: 3px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    #reviewed-translation { width: 100%; min-height: 92px; resize: vertical; }
    .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-top: 14px; }
    button { border: 1px solid #98a2b3; border-radius: 5px; padding: 8px; background: #fff; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .45; }
    #approve { background: #ecfdf3; border-color: #12b76a; }
    #approve-edited { background: #eff8ff; border-color: #2e90fa; }
    #skip { background: #fff4ed; border-color: #f79009; }
    #export-review { margin-top: 12px; width: 100%; background: #17202a; color: #fff; }
    #model-risk { color: #b42318; font-weight: 700; }
    @media (max-width: 980px) {
      .filters { grid-template-columns: repeat(2, 1fr); }
      main { grid-template-columns: 1fr; }
      #item-list, aside { border: 0; }
    }
  </style>

AAAC2lA8AAGBL+QAAALaUDwAAYEv5AAAAtpQPAABgS/kAAAC2lA8AAGBL+QAAALaUDwAAYEv5AAAAtpQPAABgS/kAAAC2lA8AAGBL+QAAALaUDwAAYEv5AAAAtpQPAABgS/kAAAC2lA8AAGBL+QAAALaUDwAAYEv5AAAAtpQPAABgS/kAAAC2lA8AAGBL+QAAALaUDwAAYEv5AAAAtpQPAABgS/kAAAC2lA8AAGBL+QAAALaUDwAAYEv5AAAAtpQPAABgS/kAAAC2lA8AAGBL+QAAALaUDwAAYEv5AAAAtpQPAABgS/kAAAC2lA8AAGAroLPaV6xQNVAAAAAASUVORK5CYII="}]}</script>
  <script>
    "use strict";
    const data = JSON.parse(document.getElementById("review-data").textContent);
    const allowedStatuses = new Set(["approved", "approved_edited", "skipped"]);
    const itemFields = [
      "item_id", "page_index", "page_type", "source_text", "normalized_text",
      "source_bbox", "source_kind", "coordinate_confidence", "decision_reason",
      "locked_tokens", "glossary_hits", "suggested_translation", "reviewed_translation",
      "review_status", "risk_level", "translation_host", "translation_execution_mode",
      "translation_model", "translation_agent_role", "translation_prompt_version",
      "placement_strategy", "target_rect", "font_size", "leader_line", "warnings"
    ];
    const elements = Object.fromEntries([
      "page-type-filter", "risk-filter", "glossary-filter", "status-filter", "issue-filter",
      "item-list", "page-thumbnail", "source-highlight", "target-highlight", "source-text",
      "suggested-translation", "reviewed-translation", "locked-tokens", "glossary-hits",
      "decision-reason", "coordinates", "layout-risk", "translator-provenance",
      "model-risk", "stats", "item-title", "approve", "approve-edited", "skip",
      "export-review"
    ].map((id) => [id, document.getElementById(id)]));
    let selectedId = null;

    function text(id, value) {
      elements[id].textContent = value === null || value === undefined ? "—" : String(value);
    }

    function addOption(select, value) {
      const option = document.createElement("option");
      option.value = value;
      option.textContent = value;
      select.appendChild(option);
    }

    [...new Set(data.items.map((item) => item.page_type))].sort().forEach((value) => {
      addOption(elements["page-type-filter"], value);
    });

    function itemIssues(item) {
      const issues = Array.isArray(item.warnings) ? [...item.warnings] : [];
      if (item.coordinate_confidence !== "high") issues.push("coordinate_confidence");
      if (item.translation_model === "unknown") issues.push("unknown_model");
      return issues;
    }

    [...new Set(data.items.flatMap(itemIssues))].sort().forEach((value) => {
      addOption(elements["issue-filter"], value);
    });

    function visible(item) {
      const status = item.review_status || "unreviewed";
      const glossary = Array.isArray(item.glossary_hits) && item.glossary_hits.length ? "hit" : "none";
      const issues = itemIssues(item);
      const issue = issues.length ? "any" : "none";
      const issueFilter = elements["issue-filter"].value;
      return (!elements["page-type-filter"].value || item.page_type === elements["page-type-filter"].value)
        && (!elements["risk-filter"].value || item.risk_level === elements["risk-filter"].value)
        && (!elements["glossary-filter"].value || glossary === elements["glossary-filter"].value)
        && (!elements["status-filter"].value || status === elements["status-filter"].value)
        && (!issueFilter || issue === issueFilter || issues.includes(issueFilter));
    }

    function renderList() {
      elements["item-list"].replaceChildren();
      data.items.filter(visible).forEach((item) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "review-item" + (item.item_id === selectedId ? " active" : "");
        button.dataset.risk = item.risk_level;
        button.textContent = `${item.item_id} · ${item.page_type} · ${item.review_status || "unreviewed"}`;
        button.addEventListener("click", () => selectItem(item.item_id));
        elements["item-list"].appendChild(button);
      });
    }

    function placeHighlight(id, rectangle, page) {
      const box = elements[id];
      if (!Array.isArray(rectangle) || rectangle.length !== 4 || !page.width || !page.height) {
        box.style.display = "none";
        return;
      }
      box.style.left = `${rectangle[0] / page.width * 100}%`;
      box.style.top = `${rectangle[1] / page.height * 100}%`;
      box.style.width = `${(rectangle[2] - rectangle[0]) / page.width * 100}%`;
      box.style.height = `${(rectangle[3] - rectangle[1]) / page.height * 100}%`;
      box.style.display = "block";
    }

    function selectItem(itemId) {
      selectedId = itemId;
      const item = data.items.find((candidate) => candidate.item_id === itemId);
      if (!item) return;
      const page = data.pages.find((candidate) => candidate.page_index === item.page_index);
      if (page) {
        elements["page-thumbnail"].src = page.thumbnail;
        elements["page-thumbnail"].onload = () => {
          placeHighlight("source-highlight", item.source_bbox, page);
          placeHighlight("target-highlight", item.target_rect, page);
        };
      }
      text("item-title", `${item.item_id} · 第 ${item.page_index + 1} 页`);
      text("source-text", item.source_text);
      text("suggested-translation", item.suggested_translation);
      elements["reviewed-translation"].value = item.reviewed_translation || item.suggested_translation || "";
      text("locked-tokens", JSON.stringify(item.locked_tokens || []));
      text("glossary-hits", JSON.stringify(item.glossary_hits || []));
      text("decision-reason", item.decision_reason);
      text("coordinates", JSON.stringify({source_bbox: item.source_bbox, target_rect: item.target_rect}));
      text("layout-risk", JSON.stringify({risk_level: item.risk_level, warnings: item.warnings || []}));
      text("translator-provenance", [
        item.translation_host, item.translation_execution_mode, item.translation_model,
        item.translation_agent_role, item.translation_prompt_version
      ].join(" · "));
      const risks = [];
      if (item.translation_model === "unknown") risks.push("模型未知");
      const switchFields = [
        ["translation_host", "宿主切换"],
        ["translation_model", "模型切换"],
        ["translation_execution_mode", "执行方式切换"],
        ["translation_prompt_version", "提示词版本切换"]
      ];
      switchFields.forEach(([field, label]) => {
        if (new Set(data.items.map((candidate) => candidate[field])).size > 1) risks.push(label);
      });
      text("model-risk", risks.join("；") || "无");
      renderList();
    }

    function setStatus(status) {
      const item = data.items.find((candidate) => candidate.item_id === selectedId);
      if (!item || !allowedStatuses.has(status)) return;
      if (status === "approved_edited") {
        const edited = elements["reviewed-translation"].value.trim();
        if (!edited) return;
        item.reviewed_translation = edited;
      } else if (status === "approved") {
        item.reviewed_translation = null;
      } else {
        item.reviewed_translation = null;
      }
      item.review_status = status;
      renderAll();
    }

    function renderStats() {
      const counts = {unreviewed: 0, approved: 0, approved_edited: 0, skipped: 0};
      data.items.forEach((item) => { counts[item.review_status || "unreviewed"] += 1; });
      text("stats", `未审核 ${counts.unreviewed} · 已批准 ${counts.approved} · 已修改 ${counts.approved_edited} · 已跳过 ${counts.skipped} · 阻断 ${data.blocking_issues.length}`);
      elements["export-review"].disabled = counts.unreviewed !== 0 || data.blocking_issues.length !== 0;
    }

    function exportReview() {
      if (data.blocking_issues.length || data.items.some((item) => !allowedStatuses.has(item.review_status))) return;
      if (data.items.some((item) => item.review_status === "approved_edited" && !(item.reviewed_translation || "").trim())) return;
      if (data.items.some((item) => item.review_status === "approved" && !(item.suggested_translation || "").trim())) return;
      const payload = {
        schema_version: "1.1",
        job_id: data.job_id,
        source: {filename: data.source.filename, sha256: data.source.sha256, page_count: data.source.page_count},
        glossary: {filename: data.glossary.filename, sha256: data.glossary.sha256},
        pipeline: {
          parser: data.pipeline.parser,
          translation_executor: data.pipeline.translation_executor,
          host: data.pipeline.host,
          execution_mode: data.pipeline.execution_mode,
          model: data.pipeline.model,
          prompt_version: data.pipeline.prompt_version
        },
        items: data.items.map((item) => Object.fromEntries(itemFields.map((field) => [field, item[field]]))),
        blocking_issues: [],
        review_completed_at: new Date().toISOString()
      };
      const blob = new Blob([JSON.stringify(payload, null, 2) + "\n"], {type: "application/json"});
      const link = document.createElement("a");
      link.href = window.URL.createObjectURL(blob);
      link.download = "review.json";
      link.click();
      window.URL.revokeObjectURL(link.href);
    }

    function renderAll() {
      renderList();
      renderStats();
    }

    ["page-type-filter", "risk-filter", "glossary-filter", "status-filter", "issue-filter"].forEach((id) => {
      elements[id].addEventListener("change", renderList);
    });
    elements.approve.addEventListener("click", () => setStatus("approved"));
    elements["approve-edited"].addEventListener("click", () => setStatus("approved_edited"));
    elements.skip.addEventListener("click", () => setStatus("skipped"));
    elements["export-review"].addEventListener("click", exportReview);
    renderAll();
    if (data.items.length) selectItem(data.items[0].item_id);
  </script>
