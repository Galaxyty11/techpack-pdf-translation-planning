<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TechPack 翻译审核</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f4f6f8; color: #17202a; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    header { display: flex; align-items: center; gap: 18px; padding: 14px 20px; background: #17202a; color: #fff; }
    header h1 { margin: 0; font-size: 20px; }
    #stats { margin-left: auto; font-variant-numeric: tabular-nums; }
    .filters { display: grid; grid-template-columns: repeat(5, minmax(130px, 1fr)); gap: 10px; padding: 12px 20px; background: #fff; border-bottom: 1px solid #d8dee4; }
    label { display: grid; gap: 4px; color: #566573; font-size: 12px; }
    select, textarea, button { font: inherit; }
    select, textarea { border: 1px solid #b8c2cc; border-radius: 5px; padding: 7px; background: #fff; }
    main { display: grid; grid-template-columns: minmax(240px, 28%) minmax(380px, 44%) minmax(260px, 28%); min-height: calc(100vh - 122px); }
    #item-list { overflow: auto; border-right: 1px solid #d8dee4; background: #fff; padding: 10px; }
    .page-group { margin: 0 0 10px; border: 1px solid #d8dee4; border-radius: 8px; background: #fff; overflow: hidden; }
    .page-group[open] { border-color: #b8c2cc; box-shadow: 0 2px 8px #10182812; }
    .page-group-summary { position: relative; padding: 11px 34px 11px 12px; background: #f8fafc; cursor: pointer; list-style: none; }
    .page-group-summary::-webkit-details-marker { display: none; }
    .page-group-summary::after { content: "展开"; position: absolute; top: 13px; right: 11px; color: #667085; font-size: 11px; }
    .page-group[open] > .page-group-summary::after { content: "收起"; }
    .page-summary-line { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .page-title { font-size: 15px; }
    .page-meta { margin-top: 4px; color: #667085; font-size: 12px; }
    .page-risk-badge, .item-badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 2px 7px; font-size: 11px; font-weight: 700; white-space: nowrap; }
    .risk-high { background: #fee4e2; color: #b42318; }
    .risk-medium { background: #fef0c7; color: #b54708; }
    .risk-low { background: #dcfae6; color: #067647; }
    .page-items { padding: 8px; border-top: 1px solid #eaecf0; }
    .review-item { display: block; width: 100%; margin: 0 0 7px; padding: 10px; text-align: left; border: 1px solid #d8dee4; border-radius: 6px; background: #fff; color: inherit; cursor: pointer; }
    .review-item:last-child { margin-bottom: 0; }
    .review-item.active { border-color: #2463a6; box-shadow: 0 0 0 2px #c8ddf3; }
    .review-item[data-risk="high"] { border-left: 5px solid #b42318; }
    .review-item-heading { display: flex; align-items: center; gap: 5px; }
    .review-item-status { margin-left: auto; background: #f2f4f7; color: #475467; }
    .review-item-source { display: block; margin-top: 6px; color: #344054; line-height: 1.35; overflow-wrap: anywhere; }
    .empty-list { padding: 24px 10px; color: #667085; text-align: center; }
    .viewer { padding: 16px; overflow: auto; }
    .canvas { position: relative; display: inline-block; max-width: 100%; background: #fff; box-shadow: 0 2px 12px #0002; }
    #page-thumbnail { display: block; max-width: 100%; height: auto; }
    #translation-layer { position: absolute; inset: 0; overflow: hidden; }
    .translation-box { position: absolute; z-index: 2; margin: 0; padding: 0; overflow: hidden; border: 1px solid transparent; border-radius: 0; background: transparent; color: #d90d0d; line-height: 1.1; text-align: left; white-space: pre-wrap; overflow-wrap: anywhere; cursor: grab; touch-action: none; }
    .translation-box:active { cursor: grabbing; }
    .translation-box.active { z-index: 3; border-color: #1570ef; outline: 2px solid #ffffffcc; }
    .highlight { position: absolute; z-index: 4; display: none; pointer-events: none; border: 3px solid #d92d20; background: #d92d2030; }
    #target-highlight { border-color: #1570ef; background: transparent; }
    #source-highlight { pointer-events: auto; cursor: move; touch-action: none; }
    #source-selection-layer { position: absolute; inset: 0; z-index: 6; cursor: crosshair; touch-action: none; }
    .adjust-controls { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; align-items: center; }
    #translation-font-size { width: 72px; padding: 6px; }
    #adjustment-hint { font-size: 12px; color: #475467; }
    aside { padding: 14px; overflow: auto; background: #fff; border-left: 1px solid #d8dee4; }
    aside h2 { margin: 0 0 12px; font-size: 17px; }
    dl { margin: 0; }
    dt { margin-top: 10px; color: #667085; font-size: 12px; font-weight: 700; }
    dd { margin: 3px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    #reviewed-translation { width: 100%; min-height: 92px; resize: vertical; }
    #position-feedback { margin: 10px 0 0; padding: 8px 10px; border: 1px solid #f79009; border-radius: 5px; background: #fff4ed; color: #9c2a10; }
    .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-top: 14px; }
    button { border: 1px solid #98a2b3; border-radius: 5px; padding: 8px; background: #fff; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .45; }
    #approve { background: #ecfdf3; border-color: #12b76a; }
    #approve-edited { background: #eff8ff; border-color: #2e90fa; }
    #skip { background: #fff4ed; border-color: #f79009; }
    #export-review { margin-top: 12px; width: 100%; background: #17202a; color: #fff; }
    #model-risk { color: #b42318; font-weight: 700; }
    .plain-lines { display: grid; gap: 5px; }
    .plain-lines p { margin: 0; }
    .risk-box { padding: 9px 10px; border: 1px solid #d0d5dd; border-radius: 6px; background: #f9fafb; }
    .risk-box[data-risk="low"] { border-color: #6ce9a6; background: #ecfdf3; }
    .risk-box[data-risk="medium"] { border-color: #fec84b; background: #fffaeb; }
    .risk-box[data-risk="high"] { border-color: #fda29b; background: #fef3f2; }
    .risk-label { display: block; margin-bottom: 3px; font-weight: 700; }
    .risk-warnings { margin: 7px 0 0; padding-left: 20px; }
    @media (max-width: 980px) {
      .filters { grid-template-columns: repeat(2, 1fr); }
      main { grid-template-columns: 1fr; }
      #item-list, aside { border: 0; }
    }
  </style>
</head>
<body>
  <header>
    <h1>TechPack 翻译审核</h1>
    <div id="stats" aria-live="polite"></div>
  </header>
  <section class="filters" aria-label="审核筛选">
    <label>页面类型<select id="page-type-filter"><option value="">全部</option></select></label>
    <label>风险<select id="risk-filter"><option value="">全部</option><option value="high">高</option><option value="medium">中</option><option value="low">低</option></select></label>
    <label>术语<select id="glossary-filter"><option value="">全部</option><option value="hit">有命中</option><option value="none">无命中</option></select></label>
    <label>审核状态<select id="status-filter"><option value="">全部</option><option value="unreviewed">未审核</option><option value="approved">已批准</option><option value="approved_edited">修改后批准</option><option value="skipped">已跳过</option></select></label>
    <label>问题<select id="issue-filter"><option value="">全部</option><option value="any">有问题</option><option value="none">无问题</option></select></label>
  </section>
  <main>
    <nav id="item-list" aria-label="审核项目"></nav>
    <section class="viewer" aria-label="页面预览">
      <div class="canvas">
        <img id="page-thumbnail" alt="当前页面缩略图">
        <div id="translation-layer" aria-label="本页全部译文"></div>
        <div id="source-highlight" class="highlight" aria-label="当前原文位置"></div>
        <div id="target-highlight" class="highlight" aria-label="当前译文位置"></div>
        <div id="source-selection-layer" aria-label="拖动框选原文" hidden></div>
      </div>
    </section>
    <aside>
      <h2 id="item-title">请选择审核项目</h2>
      <dl>
        <dt>原文</dt><dd id="source-text"></dd>
        <dd class="adjust-controls"><button id="reframe-source" type="button">重新框选原文</button><button id="reset-source" type="button">恢复原文框</button></dd>
        <dt>建议译文</dt><dd id="suggested-translation"></dd>
        <dt>审核译文</dt><dd><textarea id="reviewed-translation" aria-label="审核译文"></textarea></dd>
        <dt>译文字号（pt）</dt><dd class="adjust-controls"><button id="font-smaller" type="button" aria-label="减小字号">−</button><input id="translation-font-size" type="number" min="5" max="24" step="0.5" aria-label="译文字号"><button id="font-larger" type="button" aria-label="增大字号">＋</button><button id="reset-font" type="button">自动字号</button></dd>
        <dd id="adjustment-hint" role="status">红框可拖动；重新框选只修正位置。字号支持 5–24 pt，修改后请重新确认。</dd>
        <dt>锁定 token</dt><dd id="locked-tokens"></dd>
        <dt>术语命中</dt><dd id="glossary-hits"></dd>
        <dt>为什么需要翻译</dt><dd id="decision-reason"></dd>
        <dt>原文与译文位置</dt><dd id="coordinates" class="plain-lines"></dd>
        <dt>排版提示</dt><dd id="layout-risk"></dd>
        <dt>翻译来源</dt><dd id="translator-provenance"></dd>
        <dt>模型风险</dt><dd id="model-risk"></dd>
      </dl>
      <p id="position-feedback" role="status" aria-live="polite" hidden></p>
      <div class="actions" aria-label="审核操作">
        <button id="approve" type="button">批准</button>
        <button id="approve-edited" type="button">修改后批准</button>
        <button id="skip" type="button">跳过</button>
      </div>
      <button id="export-review" type="button" disabled>完成审核并导出</button>
    </aside>
  </main>

  <script id="review-data" type="application/json">__TECHPACK_REVIEW_DATA__</script>
  <script>__TECHPACK_REVIEW_SCRIPT__</script>
</body>
</html>
